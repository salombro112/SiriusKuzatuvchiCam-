<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kuzatuv Cam</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
<div id="app">
  <div id="mainApp" class="screen" style="display:block;">
    <header class="topbar">
      <div class="topbar-logo"><img src="logo.jpg" alt="Kuzatuv Cam" class="topbar-logo-img"> <span>Kuzatuv Cam</span></div>
      <div class="topbar-cart" id="topCartBtn">
        🛒<span class="badge" id="cartBadge" style="display:none;">0</span>
      </div>
    </header>
    <main id="content" class="content"></main>
    <nav class="bottomnav">
      <button class="nav-btn active" data-screen="home">
        <span class="nav-icon">🏠</span><span>Bosh menyu</span>
      </button>
      <button class="nav-btn" data-screen="search">
        <span class="nav-icon">🔍</span><span>Qidiruv</span>
      </button>
      <button class="nav-btn" data-screen="cart">
        <span class="nav-icon">🛒</span><span>Savat</span>
      </button>
      <button class="nav-btn" data-screen="profile">
        <span class="nav-icon">👤</span><span>Profil</span>
      </button>
    </nav>
  </div>
  <div id="toast" class="toast"></div>
</div>
<script src="products-data.js"></script>
<script src="app.js"></script>
</body>
</html>
